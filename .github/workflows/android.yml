name: Android

# Builds the experimental arm64 APK for Android packaging/release workflow changes, on CI's schedule and on
# demand, so the Android target keeps compiling. The APK is signed with a throwaway key per run;
# installing a later build means uninstalling first.
on:
  push:
    branches: [dev]
    paths:
      - packaging/android/**
      - crates/ui/**
      - Cargo.toml
      - .github/workflows/android.yml
  pull_request:
    paths:
      - packaging/android/**
      - packaging/icons/**
      - .github/workflows/android.yml
      - .github/workflows/package.yml
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Build arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      # `play` plus in-place codegen overrides: thin LTO at eight units with stripped symbols
      # is release-grade but still fits the job budget (full `release` is CU=1 and hours cold).
      CINNABAR_ANDROID_PROFILE: play
      CARGO_PROFILE_PLAY_LTO: thin
      CARGO_PROFILE_PLAY_CODEGEN_UNITS: "8"
      CARGO_PROFILE_PLAY_STRIP: symbols
      # Helio G81 Ultra (Cortex-A75 + A55, ARMv8.2-A): the Go core gets the same LSE atomics.
      GOARM64: v8.2
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the pinned Android SDK packages and cargo-ndk
        run: |
          pin() { python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' packaging/android/runtime.json "$1"; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-$(pin target_sdk)" "build-tools;$(pin build_tools)" "ndk;$(pin ndk)" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$(pin ndk)" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$(pin ndk)" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "$(pin cargo_ndk)" --locked
      - name: Install Android build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin cmake ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Build the APK
        run: bash packaging/android/build-apk.sh
      - uses: actions/upload-artifact@v7
        with:
          name: cinnabar-android-arm64
          path: target/android/*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
      # Public release asset so the APK can be sideloaded without downloading CI artifacts.
      - name: Publish the sideloadable APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="$(ls target/android/*-arm64-v8a.apk | head -n1)"
          gh release delete tuned-android --yes --cleanup-tag 2>/dev/null || true
          gh release create tuned-android "$apk" \
            --title "Cinnabar tuned for Honor X6C ($(git rev-parse --short HEAD))" \
            --notes "arm64-v8a: Cortex-A75/A55 codegen, 65% render scale, 60 FPS cap, MSAA off, 6-chunk default distance." \
            --prerelease